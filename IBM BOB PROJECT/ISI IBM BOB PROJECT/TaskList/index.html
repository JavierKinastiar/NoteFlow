<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task List</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind custom config: extend palette with orange accent -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: "#2563eb",
                dark: "#1d4ed8",
                light: "#eff6ff",
              },
              accent: {
                DEFAULT: "#f97316",
                dark: "#ea580c",
                light: "#fff7ed",
              },
            },
            boxShadow: {
              card: "0 4px 24px 0 rgba(37,99,235,0.08)",
            },
          },
        },
      };
    </script>

    <!-- Custom styles (animations, scrollbar, etc.) -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="bg-slate-100 min-h-screen flex items-start justify-center py-10 px-4">

    <!-- ===== App Wrapper ===== -->
    <main class="w-full max-w-xl">

      <!-- Header -->
      <header class="mb-8 text-center">
        <div class="inline-flex items-center gap-2 mb-2">
          <!-- Checkmark icon (inline SVG) -->
          <span class="flex items-center justify-center w-9 h-9 rounded-xl bg-primary text-white shadow-md">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
          </span>
          <h1 class="text-3xl font-bold text-slate-800 tracking-tight">Task List</h1>
        </div>
        <p class="text-slate-500 text-sm">Manage your daily tasks, simply and efficiently.</p>
      </header>

      <!-- Card Container -->
      <section class="bg-white rounded-2xl shadow-card p-6">

        <!-- Add Task Form -->
        <form id="taskForm" class="flex gap-3 mb-6" novalidate>
          <input
            id="taskInput"
            type="text"
            placeholder="Add a new task…"
            maxlength="120"
            autocomplete="off"
            class="flex-1 px-4 py-2.5 rounded-xl border border-slate-200 text-slate-700 placeholder-slate-400
                   focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent
                   transition text-sm"
          />
          <button
            type="submit"
            class="flex items-center gap-1.5 px-5 py-2.5 rounded-xl bg-primary text-white font-semibold text-sm
                   hover:bg-primary-dark active:scale-95 transition-all shadow-sm"
            aria-label="Add task"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
            </svg>
            Add
          </button>
        </form>

        <!-- Filter Tabs -->
        <nav class="flex gap-1.5 mb-5" aria-label="Filter tasks">
          <button data-filter="all"       class="filter-btn active-filter">All</button>
          <button data-filter="active"    class="filter-btn">Active</button>
          <button data-filter="completed" class="filter-btn">Completed</button>
        </nav>

        <!-- Task List -->
        <ul id="taskList" class="space-y-3" aria-live="polite" aria-label="Task list">
          <!-- Tasks are rendered dynamically by script.js -->
        </ul>

        <!-- Empty State -->
        <div id="emptyState" class="hidden flex-col items-center justify-center py-12 text-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 text-slate-300 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2
                 M9 5a2 2 0 002 2h2a2 2 0 002-2
                 M9 5a2 2 0 012-2h2a2 2 0 012 2" />
          </svg>
          <p class="text-slate-400 text-sm font-medium">No tasks here yet.</p>
          <p class="text-slate-300 text-xs mt-1">Add one above to get started!</p>
        </div>

        <!-- Footer Stats -->
        <footer class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
          <span id="statsLabel">0 task(s) left</span>
          <button
            id="clearCompleted"
            class="text-accent hover:text-accent-dark font-medium transition hidden"
            aria-label="Clear all completed tasks"
          >
            Clear Completed
          </button>
        </footer>

      </section><!-- /Card -->
    </main><!-- /main -->

    <script src="script.js"></script>
  </body>
</html>
